name: Validate and publish prompt catalog

on:
  pull_request:
    paths: ['prompts/**', 'catalog/**', 'scripts/**', '.github/workflows/catalog.yml']
  push:
    branches: [master]
    paths: ['prompts/**', 'catalog/**', 'scripts/**', '.github/workflows/catalog.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prompt-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r catalog/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/catalog.py validate
      - run: python scripts/catalog.py package --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-catalog
          path: dist/*
          if-no-files-found: error
  publish:
    needs: catalog
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prompt-catalog
          path: dist
      - name: Publish validated catalog from master
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-prompts
          target_commitish: ${{ github.sha }}
          name: Prompts Library (Latest)
          body: Validated catalog with file checksums and source commit in catalog-manifest.json.
          make_latest: true
          files: |
            dist/prompts.zip
            dist/catalog-manifest.json
            dist/checksums.sha256
